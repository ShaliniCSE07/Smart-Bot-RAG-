<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Antenna -->
  <rect x="11" y="2" width="2" height="4" rx="1" fill="#A855F7" />
  <circle cx="12" cy="2" r="2.5" fill="#22D3EE" filter="url(#glow)" />
  
  <!-- Robot Head -->
  <rect x="4" y="6" width="16" height="14" rx="4" fill="url(#botGrad)" />
  
  <!-- Ears / Connectors -->
  <rect x="2" y="10" width="2" height="6" rx="1" fill="#6366F1" />
  <rect x="20" y="10" width="2" height="6" rx="1" fill="#A855F7" />
  
  <!-- Screen/Face area -->
  <rect x="6" y="8" width="12" height="9" rx="2" fill="#0F172A" />
  
  <!-- Eyes -->
  <circle cx="9.5" cy="12" r="1.5" fill="url(#eyeGrad)" filter="url(#glow)" />
  <circle cx="14.5" cy="12" r="1.5" fill="url(#eyeGrad)" filter="url(#glow)" />
  
  <!-- Mouth -->
  <path d="M9.5 14.5c1 0.7 2 0.7 3 0" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" />
</svg>